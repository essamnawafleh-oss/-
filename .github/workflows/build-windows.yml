name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0' }
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm build.spec

      - name: Smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process dist\StreetStudies\StreetStudies.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed: $($p.ExitCode)" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\StreetStudies -DestinationPath "installer_output\StreetStudies-Portable-$env:APP_VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: StreetStudies-${{ env.APP_VERSION }}
          path: installer_output/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: دراسات الشوارع ${{ env.APP_VERSION }}
          body: |
            **للتثبيت:** نزّل `StreetStudies-Setup-${{ env.APP_VERSION }}.exe` وشغّله — يضيف أيقونة على سطح المكتب.
            **نسخة محمولة (بدون تثبيت):** `StreetStudies-Portable-${{ env.APP_VERSION }}.zip` — فك الضغط وشغّل `StreetStudies.exe`.
          files: installer_output/*
