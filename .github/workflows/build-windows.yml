name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # بناء مُشغّل PyInstaller من المصدر بدل النسخة الجاهزة العامة التي تشتبه بها برامج الحماية
          # (الطريقة الموثقة: ترجمة bootloader بأداة waf ثم تثبيت الحزمة من المصدر)
          git clone --depth 1 --branch v6.22.3 https://github.com/pyinstaller/pyinstaller.git pyi-src
          Push-Location pyi-src\bootloader
          python ./waf distclean all
          if ($LASTEXITCODE -ne 0) { throw "bootloader build failed" }
          Pop-Location
          pip install ./pyi-src
          Get-ChildItem pyi-src\PyInstaller\bootloader\Windows-64bit-intel | Format-Table Name, Length, LastWriteTime

      - name: Version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.0.$env:GITHUB_RUN_NUMBER" }
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Prepare Tesseract OCR (Arabic)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$src\tesseract.exe")) { throw "tesseract not found at $src" }
          New-Item -ItemType Directory -Force vendor | Out-Null
          Copy-Item $src vendor\tesseract -Recurse
          # تنزيل بيانات العربية مع إعادة المحاولة ومصدر احتياطي (تعطّل الخادم مؤقتاً لا يوقف البناء)
          $urls = @("https://github.com/tesseract-ocr/tessdata/raw/main/ara.traineddata",
                    "https://cdn.jsdelivr.net/gh/tesseract-ocr/tessdata@main/ara.traineddata")
          $ok = $false
          foreach ($attempt in 1..4) {
            foreach ($u in $urls) {
              try { Invoke-WebRequest $u -OutFile vendor\tesseract\tessdata\ara.traineddata -TimeoutSec 120; $ok = $true; break }
              catch { Write-Host "download failed ($u): $_" }
            }
            if ($ok) { break }
            Start-Sleep -Seconds (10 * $attempt)
          }
          if (-not $ok) { throw "could not download ara.traineddata" }
          Get-ChildItem vendor\tesseract\tessdata\*.traineddata | Where-Object { $_.Name -notin @('ara.traineddata','eng.traineddata','osd.traineddata') } | Remove-Item
          Remove-Item -Recurse -Force vendor\tesseract\doc -ErrorAction SilentlyContinue
          & vendor\tesseract\tesseract.exe --list-langs

      - name: Version info
        shell: pwsh
        run: |
          $p = $env:APP_VERSION.Split('.') + @('0','0','0')
          $t = "$($p[0]), $($p[1]), $($p[2]), 0"
          (Get-Content version_info.txt -Raw) -replace '\(1, 0, 0, 0\)', "($t)" -replace "'1\.0\.0'", "'$env:APP_VERSION'" |
            Set-Content version_info.txt -Encoding utf8

      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm build.spec

      - name: Smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process dist\StreetStudies\StreetStudies.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed: $($p.ExitCode)" }

      - name: Windows Defender scan
        shell: pwsh
        continue-on-error: true
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Host "Defender not available on runner"; exit 0 }
          & $mp -SignatureUpdate | Out-Null
          & $mp -Scan -ScanType 3 -File "$pwd\dist\StreetStudies" -DisableRemediation
          $code = $LASTEXITCODE
          if ($code -eq 2) { Write-Host "::warning::Windows Defender flagged files in the build"; & $mp -GetFiles | Out-Null }
          else { Write-Host "Defender scan result code: $code (0 = clean)" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\StreetStudies -DestinationPath "installer_output\StreetStudies-Portable-$env:APP_VERSION.zip"
          # نسخ بأسماء ثابتة حتى يبقى رابط «آخر إصدار» صالحاً دائماً
          Copy-Item "installer_output\StreetStudies-Setup-$env:APP_VERSION.exe" installer_output\StreetStudies-Setup.exe
          Copy-Item "installer_output\StreetStudies-Portable-$env:APP_VERSION.zip" installer_output\StreetStudies-Portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StreetStudies-${{ env.APP_VERSION }}
          path: installer_output/*

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: دراسات الشوارع ${{ env.APP_VERSION }}
          body: |
            **للتثبيت:** نزّل `StreetStudies-Setup.exe` وشغّله — يضيف أيقونة على سطح المكتب.
            **نسخة محمولة (بدون تثبيت):** `StreetStudies-Portable.zip` — فك الضغط وشغّل `StreetStudies.exe`.
          files: installer_output/*
